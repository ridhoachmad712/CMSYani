<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo placeholder sementara KAP Muhammad Yani.
  Inisial "MY" bergaya navy & gold, meniru identitas brosur.
  Bukan logo resmi. Ganti dengan file logo asli melalui panel Pengaturan Situs.
  Rasio 200x80 (sedikit landscape) agar area logo header tidak perlu diubah saat logo asli diupload.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80" role="img" aria-label="KAP Muhammad Yani">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDBB6A"/>
      <stop offset="1" stop-color="#C9A24B"/>
    </linearGradient>
  </defs>

  <!-- Bingkai navy dengan garis emas -->
  <rect x="1.5" y="1.5" width="197" height="77" rx="10" fill="#0B1E3D"/>
  <rect x="4.5" y="4.5" width="191" height="71" rx="8" fill="none" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- Monogram MY -->
  <text x="30" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="url(#gold)" letter-spacing="1">MY</text>

  <!-- Garis pemisah emas -->
  <line x1="108" y1="26" x2="108" y2="54" stroke="url(#gold)" stroke-width="1" opacity="0.7"/>

  <!-- Teks pendamping -->
  <text x="118" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="600" fill="#F8F6F1" letter-spacing="0.5">Muhammad</text>
  <text x="118" y="51" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="600" fill="#F8F6F1" letter-spacing="0.5">Yani</text>
  <text x="118" y="64" font-family="Arial, sans-serif" font-size="6.5" fill="#C9A24B" letter-spacing="1.5">KONSULTAN PAJAK</text>
</svg>
